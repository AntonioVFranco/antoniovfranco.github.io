# Antonio V. Franco x Huyawo V10_2 — site estatico completo.
# Toda a saida (home, blog, artigos, 11 idiomas) e servida a partir de static/.
# Hugo apenas copia static/ -> public/: nenhuma pagina e gerada por template,
# evitando duplicar o GA4 e preservando o output aprovado byte a byte.
baseURL: "https://antoniovfranco.com/"
languageCode: en
title: "Antonio V. Franco"

# Nenhuma geracao de pagina; so copia de arquivos estaticos.
disableKinds:
  - home
  - page
  - section
  - taxonomy
  - term
  - RSS
  - sitemap
  - robotsTXT
  - "404"