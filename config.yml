baseURL: "https://antoniovfranco.com/"
languageCode: en
title: "Antonio V. Franco"
theme: [PaperMod]

enableInlineShortcodes: true
enableRobotsTXT: true
# No taxonomy kinds: avoids empty /categories/ and /tags/ orphan list pages.
disableKinds:
  - taxonomy
  - term
pagination:
  pagerSize: 100

outputs:
  home:
    - HTML
    - RSS
    - LLMS
    - LLMSFull

outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
  LLMSFull:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

params:
  env: production
  author: Antonio V. Franco
  authorName: "Antonio V. Franco"
  authorEmail: "contact@antoniovfranco.com"
  twitterCreator: "@AntonioVFranco"
  person:
    "@id": "https://antoniovfranco.com/#author"
    name: "Antonio V. Franco"
    url: "https://antoniovfranco.com/"
    description: "AI engineer and independent researcher focused on LLMs, SLMs, fine-tuning, distillation, RAG, and agentic systems."
    sameAs:
      - "https://github.com/AntonioVFranco"
      - "https://x.com/AntonioVFranco"
      - "https://www.linkedin.com/in/antoniovfranco/"
      - "https://huggingface.co/AntonioVFranco"
  description: "Antonio V. Franco's personal blog featuring technical studies and work on LLMs, SLMs, fine-tuning, RAG, and agents."
  DateFormat: "January 2006"
  defaultTheme: light
  disableThemeToggle: true
  ShowReadingTime: true
  ShowBreadCrumbs: false
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowAllPagesInArchive: false
  ShowToc: false
  TocOpen: false
  ShowWordCount: false
  UseHugoToc: true
  comments: false
  math: false
  disableScrollToTop: false
  disableAnchoredHeadings: false
  disableSpecial1stPost: true
  # Profile mode disabled — using custom homepage archive
  profileMode:
    enabled: false
  socialIcons:
    - name: GitHub
      url: "https://github.com/AntonioVFranco"
    - name: LinkedIn
      url: "https://www.linkedin.com/in/antoniovfranco/"
  assets:
    disableScrollBarStyle: true
    theme_color: "#ffffff"
    msapplication_TileColor: "#ffffff"
  cover:
    hiddenInList: false
    hiddenInSingle: true
  schema:
    publisherType: "Person"
    sameAs:
      - "https://github.com/AntonioVFranco"
      - "https://www.linkedin.com/in/antoniovfranco/"
  analytics:
    google:
      SiteVerificationTag: ""
  label:
    text: "Antonio V. Franco"
  ShowFullTextinRSS: true

services:
  googleAnalytics:
    ID: ""

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    style: monokai
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
