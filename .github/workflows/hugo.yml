# Deploy Antonio V. Franco x Huyawo v13 to GitHub Pages.
# O site e 100% estatico (build final aprovado em static/); publicacao direta.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python for SEO validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SEO validation dependency
        run: python -m pip install -r scripts/requirements-seo.txt

      - name: Validate SEO and localized routes
        run: python scripts/validate-seo.py

      - name: Test existing geographic routing
        run: node --test geo-worker/index.test.mjs

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
